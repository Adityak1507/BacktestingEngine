[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "A small event-driven backtesting engine for trading strategies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]
yahoo = ["yfinance>=0.2.40"]
fast = ["numba>=0.58"]
viz = ["matplotlib>=3.5", "plotly>=5.15"]
agent = ["openai>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "yfinance>=0.2.40", "numba>=0.58", "httpx>=0.27"]
all = ["openai>=1.40", "yfinance>=0.2.40", "numba>=0.58", "matplotlib>=3.5", "plotly>=5.15", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "pytest>=7"]

[tool.setuptools]
packages = ["backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
